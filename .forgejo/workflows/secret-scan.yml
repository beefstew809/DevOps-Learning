name: secret-scan

# gitleaks over every PR's commits and every push to main (S2). A failed
# scan of a push also alerts through Apprise. How to fix a finding:
# homelab/ci-workflows docs/secret-scan.md.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    uses: homelab/ci-workflows/.forgejo/workflows/secret-scan.yml@main
    with:
      caller_event_name: ${{ github.event_name }}
      caller_before: ${{ github.event.before }}
    secrets: inherit
